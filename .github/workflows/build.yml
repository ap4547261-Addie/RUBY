name: Build Ruby APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Inject Pinecone configuration
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_HOST: ${{ secrets.PINECONE_INDEX_HOST }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("integrations/pinecone_memory.py")
          text = path.read_text(encoding="utf-8")

          marker = "# === BUILD_TIME_PINECONE_CONFIG ==="

          config = f'''
          # === BUILD_TIME_PINECONE_CONFIG ===
          PINECONE_API_KEY = {os.environ["PINECONE_API_KEY"]!r}
          PINECONE_INDEX_HOST = {os.environ["PINECONE_INDEX_HOST"]!r}
          PINECONE_INDEX_NAME = {os.environ["PINECONE_INDEX_NAME"]!r}
          # === END_BUILD_TIME_PINECONE_CONFIG ===
          '''

          start_marker = "# === BUILD_TIME_PINECONE_CONFIG ==="
          end_marker = "# === END_BUILD_TIME_PINECONE_CONFIG ==="

          if start_marker in text and end_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker) + len(end_marker)
              text = text[:start] + config.strip() + text[end:]
          else:
              text = config.strip() + "\n\n" + text

          path.write_text(text, encoding="utf-8")

          print("✅ Pinecone configuration injected into pinecone_memory.py")
          print("API key: SET")
          print("Host: SET")
          print(f"Index name: {os.environ['PINECONE_INDEX_NAME']}")
          PY

      - name: Verify Pinecone configuration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("integrations/pinecone_memory.py")
          text = path.read_text(encoding="utf-8")

          print("Checking Pinecone configuration...")

          if "PINECONE_API_KEY = '" in text:
              print("✅ API key embedded")
          else:
              print("❌ API key NOT embedded")
              raise SystemExit(1)

          if "PINECONE_INDEX_HOST = '" in text:
              print("✅ Index host embedded")
          else:
              print("❌ Index host NOT embedded")
              raise SystemExit(1)

          if "PINECONE_INDEX_NAME = '" in text:
              print("✅ Index name embedded")
          else:
              print("❌ Index name NOT embedded")
              raise SystemExit(1)
          PY

      - name: Build APK
        run: flet build apk --yes

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ruby-apk
          path: build/apk/*.apk

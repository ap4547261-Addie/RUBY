name: Build Ruby APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to manually trigger the build

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact Flet version
        # CRITICAL FIX: Pin to 0.24.0 to prevent the silent 0.26 upgrade
        run: |
          pip install flet==0.24.0
          pip install llama-cpp-python==0.3.32

      - name: Inject secrets into integrations/secrets.py
        run: |
          sed -i 's|PLACEHOLDER_API_KEY|${{ secrets.PINECONE_API_KEY }}|' integrations/secrets.py
          sed -i 's|PLACEHOLDER_INDEX_HOST|${{ secrets.PINECONE_INDEX_HOST }}|' integrations/secrets.py
          sed -i 's|PLACEHOLDER_INDEX_NAME|${{ secrets.PINECONE_INDEX_NAME }}|' integrations/secrets.py
          echo "--- secrets.py after injection ---"
          head -3 integrations/secrets.py

      - name: Clear Flet Build Cache
        # Ensures GitHub does not reuse the broken 0.26 cached build files
        run: rm -rf build/ .flet/

      - name: Build APK
        run: flet build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ruby-apk
          path: build/apk/*.apk

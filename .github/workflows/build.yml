name: Build Ruby APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Inject secrets into integrations/secrets.py
        run: |
          sed -i 's|PLACEHOLDER_API_KEY|${{ secrets.PINECONE_API_KEY }}|' integrations/secrets.py
          sed -i 's|PLACEHOLDER_INDEX_HOST|${{ secrets.PINECONE_INDEX_HOST }}|' integrations/secrets.py
          sed -i 's|PLACEHOLDER_INDEX_NAME|${{ secrets.PINECONE_INDEX_NAME }}|' integrations/secrets.py
          echo "--- secrets.py after injection ---"
          head -3 integrations/secrets.py

      - name: Build APK
        run: flet build apk --yes

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ruby1-apk
          path: build/apk/*.apk

name: Build Flet APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install Linux Desktop Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils cmake build-essential

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          local-cache: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet==0.26.0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          cache: true

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      # ▼▼▼ NEW STEP: inject Pinecone secrets into secrets.py ▼▼▼
      - name: Inject Pinecone secrets into integrations/secrets.py
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_HOST: ${{ secrets.PINECONE_INDEX_HOST }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
        run: |
          python - <<'EOF'
          import os
          path = "integrations/secrets.py"
          with open(path) as f:
              content = f.read()

          for env_name, placeholder in [
              ("PINECONE_API_KEY",     "PLACEHOLDER_API_KEY"),
              ("PINECONE_INDEX_HOST",  "PLACEHOLDER_INDEX_HOST"),
              ("PINECONE_INDEX_NAME",  "PLACEHOLDER_INDEX_NAME"),
          ]:
              value = os.environ.get(env_name, "").strip()
              if value:
                  content = content.replace(placeholder, value)
                  print(f"✅ injected {env_name} ({len(value)} chars)")
              else:
                  print(f"⚠️ {env_name} is EMPTY — placeholder left in file")

          with open(path, "w") as f:
              f.write(content)

          print("--- secrets.py preview (values redacted) ---")
          for line in content.splitlines():
              if "=" in line and not line.strip().startswith("#"):
                  k, _, v = line.partition("=")
                  v = v.strip().strip('"')
                  print(f"{k.strip()} = <{len(v)} chars>")
              else:
                  print(line)
          EOF
      # ▲▲▲ END NEW STEP ▲▲▲

      - name: Build APK
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_HOST: ${{ secrets.PINECONE_INDEX_HOST }}
          GMAIL_CREDENTIANLS_JSON: ${{ secrets.GMAIL_CREDENTIANLS_JSON }}
          GCLOUD_SERVICE_ACCOUNT_JSON: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_JSON }}
          FLET_SUPPRESS_PROMPTS: "true"
          CMAKE_ARGS: >-
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake
            -DANDROID_ABI=arm64-v8a
            -DANDROID_PLATFORM=android-24

        run: |
          if [ -n "$GMAIL_CREDENTIANLS_JSON" ]; then
            echo "$GMAIL_CREDENTIANLS_JSON" > credentials.json
          fi

          if [ -n "$GCLOUD_SERVICE_ACCOUNT_JSON" ]; then
            echo "$GCLOUD_SERVICE_ACCOUNT_JSON" > service_account.json
          fi

          rm -rf build/ dist/ __pycache__/

          flet build apk \
            --arch arm64-v8a \
            --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruby-apk
          path: |
            build/**/*.apk
            **/app-*.apk

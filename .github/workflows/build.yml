name: Build Ruby APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # FREE DISK SPACE
      # ==========================================

      - name: Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

          echo "=== Disk space ==="
          df -h


      # ==========================================
      # LINUX DEPENDENCIES
      # ==========================================

      - name: Install Linux Desktop Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libgtk-3-dev \
            mesa-utils \
            cmake \
            build-essential


      # ==========================================
      # PYTHON
      # ==========================================

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================
      # ANDROID NDK
      # ==========================================

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          local-cache: true


      # ==========================================
      # PYTHON DEPENDENCIES
      # ==========================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          pip install -r requirements.txt

          pip install flet==0.26.0


      # ==========================================
      # FLUTTER
      # ==========================================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          cache: true


      # ==========================================
      # ANDROID LICENSES
      # ==========================================

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true


      # ==========================================
      # PINECONE SECRETS
      # ==========================================

      - name: Inject Pinecone Secrets
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_HOST: ${{ secrets.PINECONE_INDEX_HOST }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}

        run: |
          python - <<'PY'
          import os

          path = "integrations/secrets.py"

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          replacements = [
              (
                  "PINECONE_API_KEY",
                  "PLACEHOLDER_API_KEY"
              ),
              (
                  "PINECONE_INDEX_HOST",
                  "PLACEHOLDER_INDEX_HOST"
              ),
              (
                  "PINECONE_INDEX_NAME",
                  "PLACEHOLDER_INDEX_NAME"
              ),
          ]

          for env_name, placeholder in replacements:
              value = os.environ.get(env_name, "").strip()

              if value:
                  content = content.replace(
                      placeholder,
                      value
                  )

                  print(
                      f"Injected {env_name} "
                      f"({len(value)} characters)"
                  )
              else:
                  print(
                      f"WARNING: {env_name} is empty"
                  )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Pinecone secret injection completed.")
          PY


      # ==========================================
      # BUILD APK
      # ==========================================

      - name: Build Ruby APK
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_HOST: ${{ secrets.PINECONE_INDEX_HOST }}

          # Keep these names exactly as your current
          # GitHub repository secrets use.
          GMAIL_CREDENTIANLS_JSON: ${{ secrets.GMAIL_CREDENTIANLS_JSON }}
          GCLOUD_SERVICE_ACCOUNT_JSON: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_JSON }}

          FLET_SUPPRESS_PROMPTS: "true"

          CMAKE_ARGS: >-
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake
            -DANDROID_ABI=arm64-v8a
            -DANDROID_PLATFORM=android-24

        run: |

          # ------------------------------------------
          # Gmail credentials
          # ------------------------------------------

          if [ -n "$GMAIL_CREDENTIANLS_JSON" ]; then
            echo "$GMAIL_CREDENTIANLS_JSON" > credentials.json
            echo "Gmail credentials file created."
          else
            echo "No Gmail credentials supplied."
          fi


          # ------------------------------------------
          # Google Cloud credentials
          # ------------------------------------------

          if [ -n "$GCLOUD_SERVICE_ACCOUNT_JSON" ]; then
            echo "$GCLOUD_SERVICE_ACCOUNT_JSON" > service_account.json
            echo "Google Cloud service account file created."
          else
            echo "No Google Cloud credentials supplied."
          fi


          # ------------------------------------------
          # Clean previous builds
          # ------------------------------------------

          rm -rf build/
          rm -rf dist/

          find . -type d -name "__pycache__" \
            -prune -exec rm -rf {} +


          # ------------------------------------------
          # Build Android APK
          # ------------------------------------------

          flet build apk \
            --arch arm64-v8a \
            --verbose


      # ==========================================
      # SHOW GENERATED APK
      # ==========================================

      - name: Find Generated APK
        run: |
          echo "=== Generated APK files ==="

          find build \
            -type f \
            -name "*.apk" \
            -print

          echo "=== APK sizes ==="

          find build \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;


      # ==========================================
      # GENERATE CHECKSUM
      # ==========================================

      - name: Generate APK SHA256
        run: |
          mkdir -p artifact

          APK=$(find build \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK found."
            exit 1
          fi

          cp "$APK" artifact/ruby.apk

          sha256sum artifact/ruby.apk \
            | tee artifact/ruby.apk.sha256

          echo "APK copied to:"
          ls -lh artifact/


      # ==========================================
      # UPLOAD APK ARTIFACT
      # ==========================================

      - name: Upload Ruby APK
        uses: actions/upload-artifact@v4
        with:
          name: ruby-apk
          path: artifact/
          if-no-files-found: error
          retention-days: 30

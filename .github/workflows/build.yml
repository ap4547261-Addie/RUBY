name: Build Ruby APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Pinecone config
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_HOST: ${{ secrets.PINECONE_INDEX_HOST }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          Path("integrations/config_secrets.py").write_text(
              f"PINECONE_API_KEY = {os.environ['PINECONE_API_KEY']!r}\n"
              f"PINECONE_INDEX_HOST = {os.environ['PINECONE_INDEX_HOST']!r}\n"
              f"PINECONE_INDEX_NAME = {os.environ['PINECONE_INDEX_NAME']!r}\n",
              encoding="utf-8",
          )

          print("Pinecone config created")
          PY

      - name: Build APK
        run: flet build apk --yes

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ruby-apk
          path: build/apk/*.apk
